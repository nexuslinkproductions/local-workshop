# llama-swap config — LOCAL-AI-LAB on-demand model shelf (v264)
# ---------------------------------------------------------------------------
# One OpenAI endpoint (http://127.0.0.1:18080/v1) that loads a model on the
# first request for it and unloads it after `ttl` seconds idle. Every model
# runs through serve/gate-run.sh, which refuses to start while ARC Raiders
# (PioneerGame.exe) is running — bench/gate.sh game_running().
#
# WHERE THE NUMBERS COME FROM
#   measured  : the Qwen3.6-35B-A3B command below is research/10-test-matrix.md
#               section 3 ("Recommended daily driver today"): the one placement
#               measured to serve a real agent prompt WITH the vision projector
#               on the B580 (12 GB). See that file before trusting any value.
#   PLACEHOLDER: every `--n-cpu-moe` / `-c` for the other three models, and the
#               MTP/spec lever, are NOT yet measured — the hillclimb runner
#               (bench/hillclimb.py) owns them. Each one is tagged below.
#               Until a model's own sweep finishes, treat its placement as a
#               starting point, not a verdict.
# ---------------------------------------------------------------------------

healthCheckTimeout: 900   # generous cold start (min 15); a 22-37 GB load takes time
logLevel: info
logToStdout: both   # 2026-10-13: upstream llama-server + watchdog stderr too, so restarts are attributable
globalTTL: 600            # idle-unload default: 10 min after the last request
unloadTimeout: 10         # seconds to wait for a clean exit before force-kill
startPort: 18100          # ${PORT} pool; above the bench ports (18081-18087) on purpose

models:

  # PRIMARY local assistant (BRIEF-27). Measured 2026-10-13 on B580 SYCL: load 2 s, 9.27 GiB VRAM,
  # decode 27 t/s, TTFT 80 ms with cached prefix. Thinking is per model id, same process + weights:
  # gemma4-12b = thinking OFF, gemma4-12b-think = ON (setParamsByID). No preload: idle-unloads after ttl.
  "gemma4-12b":
    name: "Gemma 4 12B QAT Q4_0 + mmproj — local assistant (thinking off)"
    cmd: >
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/serve/gate-run.sh
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/serve/gemma4-12b-launch.sh ${PORT}
    ttl: 600
    aliases: ["gemma4-12b-think"]
    filters:
      setParamsByID:
        gemma4-12b: { chat_template_kwargs: { enable_thinking: false } }
        # bounded: 512 = smallest budget that answered both probe puzzles correctly (research/26 r26b2); 256 failed both
        gemma4-12b-think: { chat_template_kwargs: { enable_thinking: true }, thinking_budget_tokens: 512 }
    capabilities: { in: [text, image], out: [text], tools: true, context: 65536 }

  # EVAL id (2026-10-13): the prompt A/B and the bake-off run on this, not on gemma4-12b.
  # Production gemma4-12b at ctx 65536 measured 800 MiB free VRAM with the model loaded (below the
  # 1 GiB stop line). Only the ctx differs: same weights, same launch script, q8_0 KV, -ub 1024,
  # mmproj on GPU. Thinking follows the model id as in gemma4-12b.
  "gemma4-12b-eval":
    name: "Gemma 4 12B QAT Q4_0 + mmproj — EVAL ctx 49152 (thinking off)"
    cmd: >
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/serve/gate-run.sh
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/serve/gemma4-12b-launch.sh ${PORT} 49152
    ttl: 600
    aliases: ["gemma4-12b-eval-think"]
    filters:
      setParamsByID:
        gemma4-12b-eval: { chat_template_kwargs: { enable_thinking: false } }
        gemma4-12b-eval-think: { chat_template_kwargs: { enable_thinking: true }, thinking_budget_tokens: 512 }
    capabilities: { in: [text, image], out: [text], tools: true, context: 49152 }

  "qwen3.6-35b-a3b-mtp":
    name: "Qwen3.6-35B-A3B MTP (UD-Q4_K_XL) — computer use"
    # Placement MEASURED on the base (non-MTP) build; the MTP build is the same
    # arch/quant, so this is the best-known start. MTP/spec lever is PLACEHOLDER.
    cmd: >
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/serve/gate-run.sh
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/engines/llama.cpp-vulkan-tip/build/bin/llama-server
      --host 127.0.0.1 --port ${PORT}
      -m /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/models/llm/unsloth/Qwen3.6-35B-A3B-MTP-GGUF/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
      --mmproj /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/models/llm/unsloth/Qwen3.6-35B-A3B-GGUF/mmproj-F16.gguf
      --device Vulkan0 -ngl 99 --n-cpu-moe 32
      -c 65536 -np 1 -fa on -ctk q8_0 -ctv q8_0 -fit off -t 16 --jinja
      --temp 0 --repeat-penalty 1.05
    ttl: 600
    capabilities: { in: [text, image], out: [text], tools: true, context: 65536 }

  "minicpm-v-4.7-35b-a3b":
    name: "MiniCPM-V-4.7-35B-A3B Q8_0 — MoE VLM"
    # PLACEHOLDER: --n-cpu-moe 40 is the config default (bench/configs/matrix-minicpmv47.env),
    # the 40/32/24 sweep is queued. mmproj: 4x downsampled (fewer image tokens ->
    # cheaper screenshots); mmproj-model-f16.gguf is the untested alternative.
    cmd: >
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/serve/gate-run.sh
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/engines/llama.cpp-vulkan-tip/build/bin/llama-server
      --host 127.0.0.1 --port ${PORT}
      -m /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/models/llm/openbmb/MiniCPM-V-4.7-35B-A3B-gguf/MiniCPM-V-4_7-35B-A3B-Q8_0.gguf
      --mmproj /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/models/llm/openbmb/MiniCPM-V-4.7-35B-A3B-gguf/mmproj-model-f16-4x.gguf
      --device Vulkan0 -ngl 99 --n-cpu-moe 40
      -c 65536 -np 1 -fa on -ctk q8_0 -ctv q8_0 -fit off -t 16 --jinja
      --temp 0 --repeat-penalty 1.05
    ttl: 600
    capabilities: { in: [text, image], out: [text], tools: true, context: 65536 }

  "ui-venus-1.5-30b-a3b":
    name: "UI-Venus-1.5-30B-A3B Q8_0 — GUI specialist"
    # PLACEHOLDER: --n-cpu-moe 40 is the config default (bench/configs/matrix-ui-venus.env),
    # the 40/32/24 sweep is queued. Full-attention qwen3vl_moe, so the
    # Gated-DeltaNet prompt-processing wedge (#27638) does not apply here.
    cmd: >
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/serve/gate-run.sh
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/engines/llama.cpp-vulkan-tip/build/bin/llama-server
      --host 127.0.0.1 --port ${PORT}
      -m /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/models/llm/mradermacher/UI-Venus-1.5-30B-A3B-GGUF/UI-Venus-1.5-30B-A3B.Q8_0.gguf
      --mmproj /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/models/llm/mradermacher/UI-Venus-1.5-30B-A3B-GGUF/UI-Venus-1.5-30B-A3B.mmproj-f16.gguf
      --device Vulkan0 -ngl 99 --n-cpu-moe 40
      -c 65536 -np 1 -fa on -ctk q8_0 -ctv q8_0 -fit off -t 16 --jinja
      --temp 0 --repeat-penalty 1.05
    ttl: 600
    capabilities: { in: [text, image], out: [text], tools: true, context: 65536 }

  "qwen3.8-flash-next-iq3_xxs":
    name: "Qwen3.8-Flash-Next IQ3_XXS (2 shards) — MoE"
    # PLACEHOLDER: --n-cpu-moe 0 (unknown for this arch — MoE, sweep not run) and
    # -c 65536 (research/10 section 4 says start at 131072; 262144 needs
    # MemAvailable >= 52 GiB). Shard 2 is a lazily-read n-gram table; llama.cpp
    # loads the rest from the -00001 shard path. mmproj is BF16 (only one shipped).
    cmd: >
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/serve/gate-run.sh
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/engines/llama.cpp-vulkan-tip/build/bin/llama-server
      --host 127.0.0.1 --port ${PORT}
      -m /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/models/llm/ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF/IQ3_XXS/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_XXS-00001-of-00002.gguf
      --mmproj /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/models/llm/ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF/mmproj-Qwen3.8-Flash-Next-BF16.gguf
      --device Vulkan0 -ngl 99 --n-cpu-moe 0
      -c 65536 -np 1 -fa on -ctk q8_0 -ctv q8_0 -fit off -t 16 --jinja
      --temp 0 --repeat-penalty 1.05
    ttl: 600
    capabilities: { in: [text, image], out: [text], tools: true, context: 65536 }

  # bakeoff42 (2026-10-13): Ornith-1.5-9B vs Ministral-3-14B vs the gemma4-12b baseline.
  # Ornith arch tag is qwen35 (NOT qwen3_5); a BF16 mmproj ships. Numbers + verdict:
  # research/42-model-bakeoff.md. ctx 32768: q8_0 KV is 70 KiB/token (head_dim 256), so 65536
  # would need ~4.4 GiB KV and does not fit 12 GB with a >=1.0 GiB free floor.
  "ornith-9b":
    name: "Ornith-1.5-9B Q4_K_M + mmproj (qwen35) — bakeoff42"
    cmd: >
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/serve/gate-run.sh
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/serve/bakeoff-launch.sh ${PORT} 262144
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/models/llm/ornith-ai/Ornith-1.5-9B-GGUF/Ornith-1.5-9B-Q4_K_M.gguf
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/models/llm/ornith-ai/Ornith-1.5-9B-GGUF/mmproj-Ornith-1.5-9B-BF16.gguf
      q8_0
    ttl: 600
    filters:
      setParamsByID:
        ornith-9b: { chat_template_kwargs: { enable_thinking: false } }
    capabilities: { in: [text, image], out: [text], tools: true, context: 262144 }

  # CHIEF PRODUCTION BRAIN (2026-10-13, research/56): Ornith-1.5-9B Q4_K_M at 256K. Measured best safe config:
  # q4_0 KV, vision encoder on CPU, -b/-ub 256 (BAKEOFF_EXTRA, last flag wins), NO MTP/spec flags.
  # Decode ~57 t/s, 30K prefill ~1200 t/s, min free VRAM ~1.1 GB. Fallback: gemma4-12b (untouched above).
  "ornith-chief":
    name: "Ornith-1.5-9B Q4_K_M 256K q4_0 KV, mmproj on CPU — Chief brain (thinking off)"
    cmd: >
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/serve/gate-run.sh
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/serve/bakeoff-launch.sh ${PORT} 262144
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/models/llm/ornith-ai/Ornith-1.5-9B-GGUF/Ornith-1.5-9B-Q4_K_M.gguf
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/models/llm/ornith-ai/Ornith-1.5-9B-GGUF/mmproj-Ornith-1.5-9B-BF16.gguf
      q4_0 --mmproj-cpu
    env:
      - "BAKEOFF_EXTRA=-ub 256 -b 256"
    ttl: 600
    aliases: ["ornith-chief-think"]
    filters:
      setParamsByID:
        ornith-chief: { chat_template_kwargs: { enable_thinking: false } }
        ornith-chief-think: { chat_template_kwargs: { enable_thinking: true }, thinking_budget_tokens: 512 }
    capabilities: { in: [text, image], out: [text], tools: true, context: 262144 }

  # CHIEF V3 TEST BRAIN (2026-10-13, research/58c + 60): same weights, same launch line and flags as "ornith-chief" above, but the
  # Ornith/Qwen3.5 vendor sampler is applied per id with setParamsByID. A request-body value overrides the CLI --temp 0
  # --repeat-penalty 1.05 baked into bakeoff-launch.sh, so that script and the "ornith-chief" entry stay untouched.
  # Used only by the chief-v3 profile and bench/bakeoff42/run-v3-arms.sh (which derives its own one-model config).
  "ornith-chief-v3":
    name: "Ornith-1.5-9B Q4_K_M 256K q4_0 KV, mmproj on CPU - Chief v3 (vendor sampling, thinking off)"
    cmd: >
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/serve/gate-run.sh
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/serve/bakeoff-launch.sh ${PORT} 262144
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/models/llm/ornith-ai/Ornith-1.5-9B-GGUF/Ornith-1.5-9B-Q4_K_M.gguf
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/models/llm/ornith-ai/Ornith-1.5-9B-GGUF/mmproj-Ornith-1.5-9B-BF16.gguf
      q4_0 --mmproj-cpu
    env:
      - "BAKEOFF_EXTRA=-ub 256 -b 256"
    ttl: 600
    aliases: ["ornith-chief-v3-think"]
    filters:
      setParamsByID:
        # Vendor general set (Ornith card / Qwen3.5 card, research/58c section 2): temp 1.0, top_p 0.95, top_k 20, min_p 0, presence 1.5, repetition 1.0
        ornith-chief-v3:
          chat_template_kwargs: { enable_thinking: false }
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          min_p: 0.0
          presence_penalty: 1.5
          repeat_penalty: 1.0
        # Thinking general set (same numbers per the Qwen3.5 card); budget 512 as ornith-chief-think (research/26 r26b2)
        ornith-chief-v3-think:
          chat_template_kwargs: { enable_thinking: true }
          thinking_budget_tokens: 512
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          min_p: 0.0
          presence_penalty: 1.5
          repeat_penalty: 1.0
    capabilities: { in: [text, image], out: [text], tools: true, context: 262144 }

  # Ministral-3-14B Q4_K_M is 7.67 GiB + 0.82 GiB mmproj; q8_0 KV is 85 KiB/token, so no ctx
  # >= 32768 fits 12 GB. Runs at ctx 16384 with q4_0 KV and the mmproj on CPU (--no-mmproj-offload).
  "ministral3-14b":
    name: "Ministral-3-14B-Instruct-2512 Q4_K_M + mmproj (mistral3) — bakeoff42"
    cmd: >
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/serve/gate-run.sh
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/serve/bakeoff-launch.sh ${PORT} 16384
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/models/llm/mistralai/Ministral-3-14B-Instruct-2512-GGUF/Ministral-3-14B-Instruct-2512-Q4_K_M.gguf
      /home/nexuslink/NEXUS_AI_CENTER/LOCAL-AI-LAB/models/llm/mistralai/Ministral-3-14B-Instruct-2512-GGUF/Ministral-3-14B-Instruct-2512-BF16-mmproj.gguf
      q4_0 --mmproj-cpu
    ttl: 600
    capabilities: { in: [text, image], out: [text], tools: true, context: 16384 }
