/* ---------- page chrome: neumorphism x glassmorphism x cybercore ---------- */
:root{
  --bg:#07090d;
  --ink:#d7e3ee;
  --dim:#8fa3b5;
  --cyan:#39e6ff;
  --mag:#ff3df0;
  --lime:#b6ff3d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 500px at 15% -5%, rgba(57,230,255,.10), transparent 60%),
    radial-gradient(1000px 500px at 90% 10%, rgba(255,61,240,.08), transparent 60%),
    linear-gradient(180deg,#0a0e14 0%,#07090d 100%);
  color:var(--ink);
  font-family:"Share Tech Mono",monospace;
  padding:40px 48px 80px;
}
h1{
  font-family:"Michroma",sans-serif;font-size:22px;letter-spacing:.35em;
  color:var(--cyan);text-transform:uppercase;margin-bottom:6px;
  text-shadow:0 0 18px rgba(57,230,255,.5);
}
.sub{color:var(--dim);font-size:12px;letter-spacing:.2em;margin-bottom:36px}
h2{
  font-family:"Michroma",sans-serif;font-size:15px;letter-spacing:.3em;
  color:var(--mag);text-transform:uppercase;margin:56px 0 20px;
  text-shadow:0 0 14px rgba(255,61,240,.45);
}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}

/* glass card with neumorphic edge lighting */
.card{
  position:relative;border-radius:16px;padding:22px 24px 18px;
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015) 45%,rgba(0,0,0,.25));
  backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:
    inset 1px 1px 0 rgba(255,255,255,.09),
    inset -2px -2px 6px rgba(0,0,0,.55),
    8px 8px 22px rgba(0,0,0,.55),
    -3px -3px 12px rgba(120,160,200,.05);
  overflow:hidden;
}
.card::before{ /* scanline sheen */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);
}
.card::after{ /* cybercore corner glow */
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  opacity:.5;
}
.fam{
  font-size:11px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--cyan);margin-bottom:14px;display:flex;justify-content:space-between;
}
.fam .lic{color:var(--dim);letter-spacing:.1em}
.hero{font-size:38px;line-height:1.05;font-weight:700;margin-bottom:4px;
  text-shadow:0 0 24px rgba(57,230,255,.25);white-space:nowrap}
.hero .unit{font-size:.42em;color:var(--dim);font-weight:400;letter-spacing:.15em}
.label{font-size:11px;letter-spacing:.32em;color:var(--dim);text-transform:uppercase;margin-bottom:16px}
.tele{font-size:15px;margin-bottom:10px;color:#bfe9ff}
.insight{font-size:14px;color:var(--lime);margin-bottom:14px}
.digits{font-size:16px;letter-spacing:.12em;color:var(--ink);margin-bottom:10px;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
.small{font-size:11px;color:var(--dim);line-height:1.5}

/* pairings */
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.tile{
  border-radius:14px;padding:20px 22px;
  background:linear-gradient(150deg,rgba(30,40,55,.55),rgba(10,14,20,.65));
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:
    inset 1px 1px 0 rgba(255,255,255,.10),
    inset -2px -2px 8px rgba(0,0,0,.6),
    10px 10px 26px rgba(0,0,0,.6);
}
.ptitle{font-size:10px;letter-spacing:.25em;color:var(--mag);text-transform:uppercase;margin-bottom:12px}
.phero{font-size:30px;font-weight:700;line-height:1.05;margin-bottom:3px;white-space:nowrap}
.phero .unit{font-size:.45em;font-weight:400;opacity:.6}
.plabel{font-size:10px;letter-spacing:.3em;text-transform:uppercase;opacity:.55;margin-bottom:12px}
.ptele{font-size:13px;margin-bottom:6px;color:#bfe9ff}
.pinsight{font-size:12.5px;color:var(--lime);margin-bottom:8px}
.psmall{font-size:11px;opacity:.5}
</style>
</head>
<body>

<h1>NEXUSLINK.HUD / TYPE SPECIMEN</h1>
<div class="sub">CYBERCORE GLASS DIRECTION &mdash; 18 FAMILIES &mdash; HUD SAMPLE SET</div>

<div class="grid" id="cards"></div>

<h2>Pairings &mdash; display + text</h2>
<div class="pgrid" id="pairs"></div>

<script>
const families = [
  {name:"Departure Mono",  css:'"Departure Mono",monospace',        lic:"OFL"},
  {name:"Doto",            css:'"Doto",sans-serif',                 lic:"OFL"},
  {name:"Sixtyfour",       css:'"Sixtyfour",sans-serif',            lic:"OFL"},
  {name:"Silkscreen",      css:'"Silkscreen",sans-serif',           lic:"OFL"},
  {name:"Kode Mono",       css:'"Kode Mono",monospace',             lic:"OFL"},
  {name:"Martian Mono",    css:'"Martian Mono",monospace',          lic:"OFL"},
  {name:"Monaspace Argon", css:'"Monaspace Argon",monospace',       lic:"OFL"},
  {name:"Monaspace Krypton",css:'"Monaspace Krypton",monospace',    lic:"OFL"},
  {name:"Monaspace Xenon", css:'"Monaspace Xenon",monospace',       lic:"OFL"},
  {name:"Monaspace Radon", css:'"Monaspace Radon",monospace',       lic:"OFL"},
  {name:"Commit Mono",     css:'"Commit Mono",monospace',           lic:"OFL"},
  {name:"Chakra Petch",    css:'"Chakra Petch",sans-serif',         lic:"OFL"},
  {name:"Tektur",          css:'"Tektur",sans-serif',               lic:"OFL"},
  {name:"Michroma",        css:'"Michroma",sans-serif',             lic:"OFL"},
  {name:"Oxanium",         css:'"Oxanium",sans-serif',              lic:"OFL"},
  {name:"Rajdhani",        css:'"Rajdhani",sans-serif',             lic:"OFL"},
  {name:"Share Tech Mono", css:'"Share Tech Mono",monospace',       lic:"OFL"},
  {name:"Unica One",       css:'"Unica One",sans-serif',            lic:"OFL"},
  {name:"Space Mono",      css:'"Space Mono",monospace',            lic:"OFL"},
  {name:"Syncopate",       css:'"Syncopate",sans-serif',            lic:"Apache-2.0"},
  {name:"Aldrich",         css:'"Aldrich",sans-serif',              lic:"OFL"},
];

function card(f){
  return `<div class="card" style="font-family:${f.css}">
    <div class="fam"><span>${f.name}</span><span class="lic">${f.lic}</span></div>
    <div class="hero">4.83 <span class="unit">LOAD</span></div>
    <div class="label">System Load / 1 min</div>
    <div class="tele">nvme1n1&nbsp;&nbsp;48&deg;C&nbsp;&nbsp;1.3 TB free</div>
    <div class="insight">2 updates ready: aether, mise-bin</div>
    <div class="digits">0123456789</div>
    <div class="small">11px line &mdash; the quick brown fox jumps over the lazy dog 0123456789</div>
  </div>`;
}
document.getElementById("cards").innerHTML = families.map(card).join("");

const pairings = [
  {d:"Michroma",        t:"Martian Mono",     why:"wide chrome display + engineered mono text"},
  {d:"Sixtyfour",       t:"Share Tech Mono",  why:"CRT scanline hero + terminal body"},
  {d:"Tektur",          t:"Commit Mono",      why:"condensed industrial display + neutral mono"},
  {d:"Unica One",       t:"Space Mono",       why:"thin tube caps + retro typewriter text"},
  {d:"Syncopate",       t:"Kode Mono",        why:"wide 70s NASA caps + clean modern mono"},
  {d:"Aldrich",         t:"Monaspace Xenon",  why:"squared stencil display + slab-flavoured mono"},
  {d:"Silkscreen",      t:"Departure Mono",   why:"pixel display + dot-matrix departure board"},
  {d:"Monaspace Radon", t:"Rajdhani",         why:"handwritten-ish mono hero + condensed sans text"},
];
function tile(p){
  return `<div class="tile">
    <div class="ptitle">${p.d} + ${p.t} &mdash; ${p.why}</div>
    <div class="phero" style="font-family:'${p.d}'">4.83 <span class="unit">LOAD</span></div>
    <div class="plabel" style="font-family:'${p.d}'">System Load / 1 min</div>
    <div class="ptele" style="font-family:'${p.t}'">nvme1n1&nbsp;&nbsp;48&deg;C&nbsp;&nbsp;1.3 TB free</div>
    <div class="pinsight" style="font-family:'${p.t}'">2 updates ready: aether, mise-bin</div>
    <div class="psmall" style="font-family:'${p.t}'">0123456789 &mdash; 11px the quick brown fox</div>
  </div>`;
}
document.getElementById("pairs").innerHTML = pairings.map(tile).join("");
</script>

</body>
</html>
